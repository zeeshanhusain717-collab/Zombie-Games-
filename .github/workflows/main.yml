name: Build Zombie Z Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # पुराने conflicting पाथ्स को साफ़ करना ताकि Buildozer और NDK में टकराव न हो
    - name: Clean Conflicting Runner Environment
      run: |
        echo "Clearing pre-installed GitHub runner Android paths..."
        echo "ANDROID_HOME=" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV
        unset ANDROID_HOME
        unset ANDROID_SDK_ROOT
        unset ANDROID_NDK_ROOT

    - name: Install System Dependencies for Android
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev lld build-essential

    - name: Install Python Build Tools & Pillow
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 virtualenv pillow pyjnius

    - name: Download Game Code & Auto-Scan
      run: |
        echo "Downloading main.py from official GitHub raw link..."
        curl -L "https://github.com/zeeshanhusain717-collab/Zombie-Games-/raw/refs/heads/main/main.py" -o main.py
        
        echo "Running Python syntax verification..."
        python3 -c "
        import py_compile
        py_compile.compile('main.py', doraise=True)
        print('[SUCCESS] Game code syntax is clean!')
        "

    - name: Generate Zombie Z App Icon
      run: |
        python3 -c "
        from PIL import Image, ImageDraw
        img = Image.new('RGB', (512, 512), color=(15, 30, 15))
        d = ImageDraw.Draw(img)
        d.rectangle([100, 100, 412, 412], fill=(40, 180, 40))
        d.text((140, 230), 'ZOMBIE Z', fill=(255, 255, 255))
        img.save('icon.png')
        print('[SUCCESS] Icon generated!')
        "

    - name: Create Bulletproof Buildozer Spec File
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Zombie Z Elite
        package.name = zombiez
        package.domain = org.zombie.zgame
        
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        source.include_patterns = icon.png
        icon.filename = icon.png
        
        version = 1.0
        
        requirements = python3,pygame,pillow
        orientation = landscape
        android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
        fullscreen = 1

        android.api = 31
        android.min_api = 21
        android.sdk = 30
        android.ndk = 23b
        android.accept_sdk_license = True

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Install Buildozer & Build APK
      run: |
        pip install --upgrade buildozer
        buildozer -v android debug

    - name: Upload APK Artifact (v4)
      uses: actions/upload-artifact@v4
      with:
        name: Zombie-Z-Mobile-APK
        path: bin/*.apk
