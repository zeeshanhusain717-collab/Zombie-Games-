name: Auto Build Erangel Zombie APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python & Pillow
        run: |
          python3 -m pip install --upgrade pip
          pip install Pillow

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Deep Scan & Advanced Free Fire Controls + Aura Zombies Implementation
        run: |
          python3 - << 'EOF'
          import os
          import textwrap

          print("[DEEP SCAN] Implementing Free Fire controls, aim arrows, bullet projectiles, and aura zombies...")

          # 1. Create directories
          os.makedirs("app/src/main/java/com/zombiez/game", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)

          # 2. gradle.properties
          with open("gradle.properties", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent("""\
                  org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
                  android.useAndroidX=true
                  android.enableJetifier=true
              """))

          # 3. Root build.gradle
          with open("build.gradle", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent("""\
                  plugins {
                      id 'com.android.application' version '8.1.1' apply false
                      id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
                  }

                  task clean(type: Delete) {
                      delete rootProject.buildDir
                  }
              """))

          # 4. settings.gradle
          with open("settings.gradle", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent("""\
                  pluginManagement {
                      repositories {
                          google()
                          mavenCentral()
                          gradlePluginPortal()
                      }
                  }
                  dependencyResolutionManagement {
                      repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                      repositories {
                          google()
                          mavenCentral()
                      }
                  }

                  rootProject.name = "ZombieZ-Erangel"
                  include ':app'
              """))

          # 5. app/build.gradle
          with open("app/build.gradle", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent("""\
                  plugins {
                      id 'com.android.application'
                      id 'org.jetbrains.kotlin.android'
                  }

                  android {
                      namespace 'com.zombiez.game'
                      compileSdk 33

                      defaultConfig {
                          applicationId "com.zombiez.game"
                          minSdk 21
                          targetSdk 33
                          versionCode 1
                          versionName "1.0"
                      }

                      buildTypes {
                          release {
                              minifyEnabled false
                              proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                          }
                      }

                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_1_8
                          targetCompatibility JavaVersion.VERSION_1_8
                      }

                      kotlinOptions {
                          jvmTarget = '1.8'
                      }
                  }

                  dependencies {
                      // Pure native implementation
                  }
              """))

          # 6. AndroidManifest.xml
          with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent("""\
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                      <application
                          android:allowBackup="true"
                          android:icon="@drawable/icon"
                          android:label="Zombie Z Erangel"
                          android:roundIcon="@drawable/icon"
                          android:supportsRtl="true"
                          android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                          <activity
                              android:name=".MainActivity"
                              android:exported="true"
                              android:screenOrientation="landscape">

                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>

                          </activity>
                      </application>
                  </manifest>
              """))

          # 7. MainActivity.kt
          main_code = textwrap.dedent("""\
              package com.zombiez.game

              import android.app.Activity
              import android.os.Bundle
              import android.view.Window
              import android.view.WindowManager

              class MainActivity : Activity() {
                  private lateinit var gameView: GameView

                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      requestWindowFeature(Window.FEATURE_NO_TITLE)
                      window.setFlags(
                          WindowManager.LayoutParams.FLAG_FULLSCREEN,
                          WindowManager.LayoutParams.FLAG_FULLSCREEN
                      )
                      gameView = GameView(this)
                      setContentView(gameView)
                  }

                  override fun onResume() {
                      super.onResume()
                      gameView.resume()
                  }

                  override fun onPause() {
                      super.onPause()
                      gameView.pause()
                  }
              }
          """)
          with open("app/src/main/java/com/zombiez/game/MainActivity.kt", "w", encoding="utf-8") as f:
              f.write(main_code)

          # 8. GameView.kt (Advanced Controls, Aim Laser, Bullets, Aura Zombies, 20000 Map)
          game_code = textwrap.dedent("""\
              package com.zombiez.game

              import android.content.Context
              import android.graphics.Bitmap
              import android.graphics.BitmapFactory
              import android.graphics.Canvas
              import android.graphics.Color
              import android.graphics.Paint
              import android.view.MotionEvent
              import android.view.SurfaceHolder
              import android.view.SurfaceView
              import kotlin.math.*
              import kotlin.random.Random

              class GameView(context: Context) : SurfaceView(context), Runnable, SurfaceHolder.Callback {
                  private var thread: Thread? = null
                  private var isPlaying = false
                  private lateinit var canvas: Canvas
                  private val paint = Paint()

                  private var screenWidth = 1280f
                  private var screenHeight = 720f

                  private var gameState = 0
                  private var playerCoins = 1000

                  // 20000x20000 Massive Map Coordinates
                  private var playerX = 10000f
                  private var playerY = 10000f
                  private var playerHp = 200f
                  private var maxPlayerHp = 200f
                  private var walkSpeed = 3.5f
                  private var sprintSpeed = 7.0f
                  private var isSprinting = false

                  // Aim Angle & Weapons
                  private var aimAngle = 0f
                  private var currentWeaponIndex = 0 // 0: Pistol, 1: Assault Rifle
                  private val weaponNames = arrayOf("PISTOL (9mm)", "ASSAULT RIFLE (5.56)")

                  // Movement Joystick
                  private var joyActive = false
                  private var joyX = 180f
                  private var joyY = 540f
                  private var joyKnobX = 180f
                  private var joyKnobY = 540f
                  private val joyRadius = 75f

                  // Sprint Button Box
                  private var sprintBtnX = 180f
                  private var sprintBtnY = 410f
                  private val sprintBtnRadius = 45f

                  // Weapon Switch Button Box (Top Right)
                  private var switchBtnX = 1120f
                  private var switchBtnY = 60f

                  // Bitmaps for Sprites
                  private var playerBitmap: Bitmap? = null
                  private var zombieBitmap: Bitmap? = null

                  // Zombie Class with Aura & Slow Speeds
                  private class Zombie(var x: Float, var y: Float, val type: Int) {
                      // Type 1: Walker (Slow), Type 2: Axeman (Medium, Red Aura), Type 3: Tank Boss (Very Slow, Green Aura)
                      var hp: Float = if (type == 1) 100f else if (type == 2) 150f else 300f
                      val maxHp: Float = hp
                      val speed: Float = if (type == 1) 1.2f else if (type == 2) 1.8f else 0.9f
                      val radius: Float = if (type == 3) 30f else 20f
                  }
                  private val zombies = mutableListOf<Zombie>()

                  // Bullet Class
                  private class Bullet(var x: Float, var y: Float, val vx: Float, val vy: Float) {
                      var distanceTraveled = 0f
                      val maxRange = 900f
                  }
                  private val bullets = mutableListOf<Bullet>()

                  private var zoneRadius = 9500f

                  init {
                      holder.addCallback(this)
                      isFocusable = true
                      try {
                          val pId = context.resources.getIdentifier("player", "drawable", context.packageName)
                          val zId = context.resources.getIdentifier("zombie", "drawable", context.packageName)
                          if (pId != 0) playerBitmap = BitmapFactory.decodeResource(context.resources, pId)
                          if (zId != 0) zombieBitmap = BitmapFactory.decodeResource(context.resources, zId)
                      } catch (e: Exception) {}
                  }

                  override fun surfaceCreated(holder: SurfaceHolder) {
                      isPlaying = true
                      thread = Thread(this)
                      thread?.start()
                  }

                  override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                      screenWidth = width.toFloat()
                      screenHeight = height.toFloat()
                      joyY = screenHeight - 160f
                      joyX = 180f
                      joyKnobX = joyX
                      joyKnobY = joyY
                      sprintBtnX = 180f
                      sprintBtnY = joyY - 130f
                      switchBtnX = screenWidth - 160f
                      switchBtnY = 60f
                  }

                  override fun surfaceDestroyed(holder: SurfaceHolder) {
                      isPlaying = false
                      try { thread?.join() } catch (e: Exception) {}
                  }

                  fun resume() {
                      isPlaying = true
                      thread = Thread(this)
                      thread?.start()
                  }

                  fun pause() {
                      isPlaying = false
                      try { thread?.join() } catch (e: Exception) {}
                  }

                  private fun startBattle() {
                      gameState = 3
                      playerX = 10000f
                      playerY = 10000f
                      playerHp = maxPlayerHp
                      zoneRadius = 9500f
                      zombies.clear()
                      bullets.clear()
                      // Spawn 35 aura zombies across the 20000x20000 map
                      for (i in 0 until 35) {
                          zombies.add(Zombie(Random.nextFloat() * 19000f + 500f, Random.nextFloat() * 19000f + 500f, Random.nextInt(1, 4)))
                      }
                  }

                  override fun run() {
                      val targetTime = 1000000000L / 60
                      while (isPlaying) {
                          val now = System.nanoTime()
                          if (holder.surface.isValid) {
                              canvas = holder.lockCanvas()
                              synchronized(holder) {
                                  update()
                                  drawGame(canvas)
                              }
                              holder.unlockCanvasAndPost(canvas)
                          }
                          val elapsed = System.nanoTime() - now
                          val waitTime = (targetTime - elapsed) / 1000000L
                          if (waitTime > 0) {
                              try { Thread.sleep(waitTime) } catch (e: Exception) {}
                          }
                      }
                  }

                  private fun update() {
                      if (gameState == 3) {
                          // Movement via Joystick & Sprint
                          if (joyActive) {
                              val dx = joyKnobX - joyX
                              val dy = joyKnobY - joyY
                              val dist = hypot(dx, dy)
                              if (dist > 5f) {
                                  val currentSpeed = if (isSprinting) sprintSpeed else walkSpeed
                                  playerX += (dx / dist) * currentSpeed
                                  playerY += (dy / dist) * currentSpeed
                                  playerX = playerX.coerceIn(200f, 19800f)
                                  playerY = playerY.coerceIn(200f, 19800f)
                                  aimAngle = atan2(dy, dx)
                              }
                          }

                          // Update Bullets
                          val bulletIter = bullets.iterator()
                          while (bulletIter.hasNext()) {
                              val b = bulletIter.next()
                              b.x += b.vx
                              b.y += b.vy
                              b.distanceTraveled += hypot(b.vx, b.vy)

                              // Check hit against zombies
                              var hit = false
                              for (z in zombies) {
                                  if (hypot(b.x - z.x, b.y - z.y) < z.radius + 15f) {
                                      z.hp -= if (currentWeaponIndex == 0) 35f else 60f
                                      hit = true
                                      if (z.hp <= 0) {
                                          zombies.remove(z)
                                          playerCoins += 30
                                      }
                                      break
                                  }
                              }

                              if (hit || b.distanceTraveled > b.maxRange || b.x < 0 || b.x > 20000f || b.y < 0 || b.y > 20000f) {
                                  bulletIter.remove()
                              }
                          }

                          // Update Zombies (Slow speed + Aura effects)
                          for (z in zombies) {
                              val zdx = playerX - z.x
                              val zdy = playerY - z.y
                              val zDist = hypot(zdx, zdy)

                              // Tank Boss Green Aura Damage over time if close
                              if (z.type == 3 && zDist < 180f) {
                                  playerHp -= 0.2f
                              }

                              if (zDist > 25f) {
                                  z.x += (zdx / zDist) * z.speed
                                  z.y += (zdy / zDist) * z.speed
                              } else {
                                  // Attack damage based on zombie type
                                  val damage = if (z.type == 3) 1.2f else if (z.type == 2) 0.8f else 0.4f
                                  playerHp -= damage
                                  if (playerHp <= 0) gameState = 4
                              }
                          }

                          if (zoneRadius > 1000f) zoneRadius -= 0.06f
                          if (hypot(playerX - 10000f, playerY - 10000f) > zoneRadius) {
                              playerHp -= 0.4f
                              if (playerHp <= 0) gameState = 4
                          }

                          if (zombies.isEmpty()) gameState = 5
                      }
                  }

                  private fun drawGame(canvas: Canvas) {
                      canvas.drawColor(Color.rgb(35, 100, 35))

                      val camX = playerX - screenWidth / 2f
                      val camY = playerY - screenHeight / 2f

                      canvas.save()
                      canvas.translate(-camX, -camY)

                      // Pochinki Town Complex
                      paint.color = Color.rgb(80, 50, 35)
                      canvas.drawRect(9200f, 9200f, 10800f, 10800f, paint)
                      paint.color = Color.rgb(160, 45, 45)
                      canvas.drawRect(9400f, 9400f, 10600f, 10600f, paint)

                      // Blue Zone
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = 12f
                      paint.color = Color.rgb(20, 90, 255)
                      canvas.drawCircle(10000f, 10000f, zoneRadius, paint)
                      paint.style = Paint.Style.FILL

                      // Draw Zombies with Aura Rings
                      for (z in zombies) {
                          // Aura drawing based on type
                          if (z.type == 2) {
                              paint.color = Color.argb(80, 255, 50, 50) // Axeman Red Aura
                              canvas.drawCircle(z.x, z.y, 45f, paint)
                          } else if (z.type == 3) {
                              paint.color = Color.argb(80, 50, 255, 50) // Tank Boss Green Aura
                              canvas.drawCircle(z.x, z.y, 70f, paint)
                          }

                          if (zombieBitmap != null) {
                              canvas.drawBitmap(zombieBitmap!!, z.x - 32f, z.y - 32f, paint)
                          } else {
                              paint.color = if (z.type == 3) Color.rgb(120, 20, 120) else if (z.type == 2) Color.rgb(180, 90, 30) else Color.rgb(50, 140, 50)
                              canvas.drawCircle(z.x, z.y, z.radius, paint)
                          }

                          // Zombie HP Bar
                          paint.color = Color.RED
                          canvas.drawRect(z.x - 25f, z.y - 45f, z.x + 25f, z.y - 40f, paint)
                          paint.color = Color.YELLOW
                          val fill = (z.hp / z.maxHp) * 50f
                          canvas.drawRect(z.x - 25f, z.y - 45f, z.x - 25f + fill, z.y - 40f, paint)
                      }

                      // Draw Bullets
                      paint.color = Color.YELLOW
                      for (b in bullets) {
                          canvas.drawCircle(b.x, b.y, 6f, paint)
                      }

                      // Draw Player & Aim Arrow / Laser
                      if (playerBitmap != null) {
                          canvas.drawBitmap(playerBitmap!!, playerX - 32f, playerY - 32f, paint)
                      } else {
                          paint.color = Color.rgb(40, 90, 220)
                          canvas.drawCircle(playerX, playerY, 25f, paint)
                      }

                      // Directional Aim Arrow / Laser Line
                      paint.strokeWidth = 4f
                      var isAimedAtZombie = false
                      for (z in zombies) {
                          if (hypot(z.x - playerX, z.y - playerY) < 700f) {
                              isAimedAtZombie = true
                              break
                          }
                      }
                      paint.color = if (isAimedAtZombie) Color.RED else Color.WHITE
                      val arrowEndX = playerX + cos(aimAngle) * 75f
                      val arrowEndY = playerY + sin(aimAngle) * 75f
                      canvas.drawLine(playerX, playerY, arrowEndX, arrowEndY, paint)

                      canvas.restore()

                      // HUD UI Controls (Free Fire Style)
                      when (gameState) {
                          0 -> {
                              canvas.drawColor(Color.rgb(20, 20, 25))
                              paint.textSize = 42f
                              paint.color = Color.rgb(235, 130, 20)
                              canvas.drawText("ZOMBIE Z: ERANGEL MOBILE ELITE", screenWidth / 2 - 380f, 180f, paint)
                              paint.color = Color.rgb(210, 50, 50)
                              canvas.drawRect(screenWidth / 2 - 160f, 320f, screenWidth / 2 + 160f, 410f, paint)
                              paint.color = Color.WHITE
                              paint.textSize = 32f
                              canvas.drawText("START SURVIVAL", screenWidth / 2 - 130f, 375f, paint)
                          }
                          3 -> {
                              // Movement Joystick Base & Knob
                              paint.color = Color.argb(100, 255, 255, 255)
                              canvas.drawCircle(joyX, joyY, joyRadius, paint)
                              paint.color = Color.rgb(0, 210, 210)
                              canvas.drawCircle(joyKnobX, joyKnobY, 30f, paint)

                              // Sprint Button (Above Joystick)
                              paint.color = if (isSprinting) Color.rgb(255, 165, 0) else Color.argb(150, 100, 100, 100)
                              canvas.drawCircle(sprintBtnX, sprintBtnY, sprintBtnRadius, paint)
                              paint.color = Color.WHITE
                              paint.textSize = 20f
                              canvas.drawText("RUN", sprintBtnX - 22f, sprintBtnY + 7f, paint)

                              // Fire Button (Bottom Right)
                              paint.color = Color.rgb(210, 50, 50)
                              canvas.drawCircle(screenWidth - 150f, screenHeight - 150f, 75f, paint)
                              paint.color = Color.WHITE
                              paint.textSize = 28f
                              canvas.drawText("FIRE", screenWidth - 180f, screenHeight - 140f, paint)

                              // Weapon Switch Button (Top Right)
                              paint.color = Color.argb(180, 40, 40, 50)
                              canvas.drawRect(switchBtnX - 110f, switchBtnY - 30f, switchBtnX + 30f, switchBtnY + 30f, paint)
                              paint.color = Color.YELLOW
                              paint.textSize = 22f
                              canvas.drawText(weaponNames[currentWeaponIndex], switchBtnX - 100f, switchBtnY + 8f, paint)

                              // Status Info
                              paint.textSize = 24f
                              paint.color = Color.YELLOW
                              canvas.drawText("HP: ${playerHp.toInt()} | Zombies: ${zombies.size} | Coins: $playerCoins🪙", 40f, 50f, paint)
                          }
                          4 -> {
                              canvas.drawColor(Color.BLACK)
                              paint.textSize = 45f; paint.color = Color.RED
                              canvas.drawText("YOU DIED IN THE ERANGEL FOG...", screenWidth / 2 - 330f, screenHeight / 2 - 30f, paint)
                          }
                          5 -> {
                              canvas.drawColor(Color.BLACK)
                              paint.textSize = 45f; paint.color = Color.GREEN
                              canvas.drawText("ERANGEL DAY SURVIVED!", screenWidth / 2 - 220f, screenHeight / 2 - 30f, paint)
                          }
                      }
                  }

                  override fun onTouchEvent(event: MotionEvent): Boolean {
                      val x = event.x; val y = event.y
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              when (gameState) {
                                  0 -> startBattle()
                                  3 -> {
                                      // Check Sprint Button
                                      if (hypot(x - sprintBtnX, y - sprintBtnY) <= sprintBtnRadius) {
                                          isSprinting = !isSprinting
                                      }
                                      // Check Weapon Switch Button
                                      else if (x >= switchBtnX - 110f && x <= switchBtnX + 30f && y >= switchBtnY - 30f && y <= switchBtnY + 30f) {
                                          currentWeaponIndex = (currentWeaponIndex + 1) % weaponNames.size
                                      }
                                      // Check Fire Button
                                      else if (hypot(x - (screenWidth - 150f), y - (screenHeight - 150f)) <= 75f) {
                                          val speed = 18f
                                          val vx = cos(aimAngle) * speed
                                          val vy = sin(aimAngle) * speed
                                          bullets.add(Bullet(playerX, playerY, vx, vy))
                                      }
                                      // Check Movement Joystick
                                      else if (hypot(x - joyX, y - joyY) <= joyRadius + 50f) {
                                          joyActive = true
                                          joyKnobX = x
                                          joyKnobY = y
                                      }
                                  }
                                  4, 5 -> gameState = 0
                              }
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (joyActive) {
                                  val dx = x - joyX
                                  val dy = y - joyY
                                  val dist = hypot(dx, dy)
                                  if (dist > joyRadius) {
                                      joyKnobX = joyX + (dx / dist) * joyRadius
                                      joyKnobY = joyY + (dy / dist) * joyRadius
                                  } else {
                                      joyKnobX = x
                                      joyKnobY = y
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              joyActive = false
                              joyKnobX = joyX
                              joyKnobY = joyY
                          }
                      }
                      return true
                  }
              }
          """)
          with open("app/src/main/java/com/zombiez/game/GameView.kt", "w", encoding="utf-8") as f:
              f.write(game_code)

          print("[SUCCESS] Free Fire controls, aiming laser, and aura zombies implemented successfully!")
          EOF

      - name: Generate Assets via Python
        run: |
          python3 - << 'EOF'
          from PIL import Image, ImageDraw
          import os

          os.makedirs("app/src/main/res/drawable", exist_ok=True)

          # 1. App Icon (512x512)
          icon = Image.new("RGB", (512, 512), color=(20, 25, 30))
          d = ImageDraw.Draw(icon)
          d.rectangle([100, 100, 412, 412], fill=(210, 50, 50))
          d.text((160, 230), "Z-Z", fill=(255, 255, 255))
          icon.save("app/src/main/res/drawable/icon.png")

          # 2. Player Sprite
          player = Image.new("RGBA", (64, 64), (0, 0, 0, 0))
          pd = ImageDraw.Draw(player)
          pd.ellipse([16, 16, 48, 48], fill=(40, 90, 220))
          pd.rectangle([28, 0, 36, 20], fill=(255, 255, 255))
          player.save("app/src/main/res/drawable/player.png")

          # 3. Zombie Sprite
          zombie = Image.new("RGBA", (64, 64), (0, 0, 0, 0))
          zd = ImageDraw.Draw(zombie)
          zd.ellipse([12, 12, 52, 52], fill=(34, 139, 34))
          zd.ellipse([24, 24, 40, 40], fill=(210, 50, 50))
          zombie.save("app/src/main/res/drawable/zombie.png")
          print("[SUCCESS] Sprites generated successfully!")
          EOF

      - name: Generate Gradle Wrapper & Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombieZ-Erangel-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
