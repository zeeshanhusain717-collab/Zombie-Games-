name: Auto Build Zombie Z 3D Test APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Write 3D Test Source Files
        run: |
          mkdir -p app/src/main/java/com/zombiez/game

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ZombieZ-3D-Test"
          include ':app'
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.zombiez.game'
              compileSdk 34

              defaultConfig {
                  applicationId "com.zombiez.game"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-test"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }

          dependencies {
              // No external libraries, pure OpenGL ES 2.0
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Zombie Z 3D Test"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/zombiez/game/MainActivity.kt << 'EOF'
          package com.zombiez.game

          import android.app.Activity
          import android.opengl.GLSurfaceView
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.WindowManager

          class MainActivity : Activity() {
              private lateinit var glView: GLSurfaceView
              private lateinit var renderer: GameRenderer

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  renderer = GameRenderer()
                  glView = GLSurfaceView(this)
                  glView.setEGLContextClientVersion(2)
                  glView.setRenderer(renderer)
                  glView.renderMode = GLSurfaceView.RENDERMODE_CONTINUOUSLY
                  setContentView(glView)
              }

              override fun onResume() {
                  super.onResume()
                  glView.onResume()
              }

              override fun onPause() {
                  super.onPause()
                  glView.onPause()
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  val w = glView.width.toFloat()
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val i = event.actionIndex
                          renderer.touchDown(event.getPointerId(i), event.getX(i), event.getY(i), w)
                      }
                      MotionEvent.ACTION_MOVE -> {
                          for (i in 0 until event.pointerCount) {
                              renderer.touchMove(event.getPointerId(i), event.getX(i), event.getY(i))
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> {
                          renderer.touchUp(event.getPointerId(event.actionIndex))
                      }
                      MotionEvent.ACTION_CANCEL -> renderer.touchCancel()
                  }
                  return true
              }
          }
          EOF

          cat > app/src/main/java/com/zombiez/game/GameRenderer.kt << 'EOF'
          package com.zombiez.game

          import android.opengl.GLES20
          import android.opengl.GLSurfaceView
          import android.opengl.Matrix
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.sin

          class Mesh(verts: FloatArray, normals: FloatArray) {
              val count: Int = verts.size / 3
              val pos: FloatBuffer = toBuffer(verts)
              val nor: FloatBuffer = toBuffer(normals)

              private fun toBuffer(a: FloatArray): FloatBuffer {
                  val bb = ByteBuffer.allocateDirect(a.size * 4).order(ByteOrder.nativeOrder())
                  val fb = bb.asFloatBuffer()
                  fb.put(a)
                  fb.position(0)
                  return fb
              }
          }

          class GameRenderer : GLSurfaceView.Renderer {

              private val VERTEX_SHADER = """
                  attribute vec3 aPos;
                  attribute vec3 aNor;
                  uniform mat4 uMVP;
                  varying vec3 vN;
                  void main() {
                      vN = aNor;
                      gl_Position = uMVP * vec4(aPos, 1.0);
                  }
              """.trimIndent()

              private val FRAGMENT_SHADER = """
                  precision mediump float;
                  uniform vec3 uColor;
                  varying vec3 vN;
                  void main() {
                      float l = max(dot(normalize(vN), normalize(vec3(0.4, 1.0, 0.3))), 0.0);
                      float shade = 0.35 + 0.65 * l;
                      gl_FragColor = vec4(uColor * shade, 1.0);
                  }
              """.trimIndent()

              private val proj = FloatArray(16)
              private val view = FloatArray(16)
              private val model = FloatArray(16)
              private val tmp = FloatArray(16)
              private val mvp = FloatArray(16)

              private var program = 0
              private var aPos = 0
              private var aNor = 0
              private var uMVP = 0
              private var uColor = 0

              private lateinit var cube: Mesh
              private lateinit var plane: Mesh

              // Buildings: x, z, width, height, depth
              private val buildings = arrayOf(
                  floatArrayOf(-25f, -20f, 10f, 16f, 10f),
                  floatArrayOf(20f, -30f, 12f, 22f, 8f),
                  floatArrayOf(30f, 25f, 9f, 12f, 14f),
                  floatArrayOf(-40f, 30f, 14f, 18f, 9f),
                  floatArrayOf(5f, 45f, 16f, 26f, 12f),
                  floatArrayOf(-10f, -55f, 8f, 10f, 8f)
              )

              // Building color palette. Wave-based change will use this later.
              private val buildingColors = arrayOf(
                  floatArrayOf(0.55f, 0.45f, 0.35f),
                  floatArrayOf(0.45f, 0.5f, 0.6f),
                  floatArrayOf(0.6f, 0.4f, 0.4f)
              )
              private var tint = 0

              // Player state
              private var px = 0f
              private var pz = 0f
              private var yaw = 0f
              private val moveSpeed = 6f

              // Touch state (protected by lock)
              private val lock = Any()
              private val touches = HashMap<Int, FloatArray>() // [side(0=move,1=look), originX, originY, lastX, lastY]
              private var stickX = 0f
              private var stickY = 0f
              private var lookDelta = 0f
              private var screenW = 1f

              private var lastTime = 0L

              // ---------- touch API (called from UI thread) ----------
              fun touchDown(id: Int, x: Float, y: Float, w: Float) {
                  synchronized(lock) {
                      screenW = w
                      val side = if (x < w / 2f) 0f else 1f
                      touches[id] = floatArrayOf(side, x, y, x, y)
                      if (side == 0f) {
                          stickX = 0f
                          stickY = 0f
                      }
                  }
              }

              fun touchMove(id: Int, x: Float, y: Float) {
                  synchronized(lock) {
                      val t = touches[id] ?: return
                      if (t[0] == 0f) {
                          stickX = ((x - t[1]) / 120f).coerceIn(-1f, 1f)
                          stickY = ((y - t[2]) / 120f).coerceIn(-1f, 1f)
                      } else {
                          lookDelta += x - t[3]
                      }
                      t[3] = x
                      t[4] = y
                  }
              }

              fun touchUp(id: Int) {
                  synchronized(lock) {
                      val t = touches.remove(id) ?: return
                      if (t[0] == 0f) {
                          stickX = 0f
                          stickY = 0f
                      }
                  }
              }

              fun touchCancel() {
                  synchronized(lock) {
                      touches.clear()
                      stickX = 0f
                      stickY = 0f
                  }
              }

              // ---------- GL lifecycle ----------
              override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                  GLES20.glClearColor(0.55f, 0.8f, 1f, 1f)
                  GLES20.glEnable(GLES20.GL_DEPTH_TEST)

                  val vs = compileShader(GLES20.GL_VERTEX_SHADER, VERTEX_SHADER)
                  val fs = compileShader(GLES20.GL_FRAGMENT_SHADER, FRAGMENT_SHADER)
                  program = GLES20.glCreateProgram()
                  GLES20.glAttachShader(program, vs)
                  GLES20.glAttachShader(program, fs)
                  GLES20.glLinkProgram(program)

                  aPos = GLES20.glGetAttribLocation(program, "aPos")
                  aNor = GLES20.glGetAttribLocation(program, "aNor")
                  uMVP = GLES20.glGetUniformLocation(program, "uMVP")
                  uColor = GLES20.glGetUniformLocation(program, "uColor")

                  cube = buildCube()
                  plane = buildPlane()
                  lastTime = System.nanoTime()
              }

              override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                  GLES20.glViewport(0, 0, width, height)
                  val aspect = width.toFloat() / height.toFloat()
                  Matrix.perspectiveM(proj, 0, 60f, aspect, 0.1f, 300f)
              }

              override fun onDrawFrame(gl: GL10?) {
                  val now = System.nanoTime()
                  val dt = ((now - lastTime) / 1_000_000_000f).coerceIn(0f, 0.05f)
                  lastTime = now

                  var sx = 0f
                  var sy = 0f
                  var look = 0f
                  synchronized(lock) {
                      sx = stickX
                      sy = stickY
                      look = lookDelta
                      lookDelta = 0f
                  }

                  // Camera rotation from right-side drag
                  yaw += look * 0.01f

                  // Movement relative to camera direction
                  if (hypot(sx, sy) > 0.12f) {
                      val fx = sin(yaw)
                      val fz = cos(yaw)
                      val rx = cos(yaw)
                      val rz = -sin(yaw)
                      val forwardAmt = -sy
                      val sideAmt = sx
                      var dx = rx * sideAmt + fx * forwardAmt
                      var dz = rz * sideAmt + fz * forwardAmt
                      val len = hypot(dx, dz)
                      if (len > 1f) {
                          dx /= len
                          dz /= len
                      }
                      val step = moveSpeed * dt
                      val nx = (px + dx * step).coerceIn(-90f, 90f)
                      if (!blocked(nx, pz)) px = nx
                      val nz = (pz + dz * step).coerceIn(-90f, 90f)
                      if (!blocked(px, nz)) pz = nz
                  }

                  // Third-person camera behind the player
                  val camDist = 9f
                  val camHeight = 4.5f
                  val ex = px - sin(yaw) * camDist
                  val ez = pz - cos(yaw) * camDist
                  Matrix.setLookAtM(view, 0, ex, camHeight, ez, px, 1.2f, pz, 0f, 1f, 0f)

                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT or GLES20.GL_DEPTH_BUFFER_BIT)
                  GLES20.glUseProgram(program)

                  // Ground
                  drawBox(plane, 0f, 0f, 0f, 200f, 1f, 200f, 0.25f, 0.55f, 0.25f)

                  // Buildings
                  val bc = buildingColors[tint]
                  for (b in buildings) {
                      drawBox(cube, b[0], b[3] / 2f, b[1], b[2], b[3], b[4], bc[0], bc[1], bc[2])
                  }

                  // Player: body and head
                  drawBox(cube, px, 0.6f, pz, 0.8f, 1.2f, 0.6f, 0.2f, 0.4f, 0.9f)
                  drawBox(cube, px, 1.5f, pz, 0.5f, 0.5f, 0.5f, 0.9f, 0.75f, 0.6f)
              }

              // ---------- helpers ----------
              private fun blocked(x: Float, z: Float): Boolean {
                  for (b in buildings) {
                      if (abs(x - b[0]) < b[2] / 2f + 0.6f && abs(z - b[1]) < b[4] / 2f + 0.6f) return true
                  }
                  return false
              }

              private fun drawBox(
                  mesh: Mesh,
                  tx: Float, ty: Float, tz: Float,
                  sx: Float, sy: Float, sz: Float,
                  r: Float, g: Float, b: Float
              ) {
                  Matrix.setIdentityM(model, 0)
                  Matrix.translateM(model, 0, tx, ty, tz)
                  Matrix.scaleM(model, 0, sx, sy, sz)

                  Matrix.multiplyMM(tmp, 0, view, 0, model, 0)
                  Matrix.multiplyMM(mvp, 0, proj, 0, tmp, 0)

                  GLES20.glUniformMatrix4fv(uMVP, 1, false, mvp, 0)
                  GLES20.glUniform3f(uColor, r, g, b)

                  GLES20.glEnableVertexAttribArray(aPos)
                  GLES20.glVertexAttribPointer(aPos, 3, GLES20.GL_FLOAT, false, 0, mesh.pos)
                  GLES20.glEnableVertexAttribArray(aNor)
                  GLES20.glVertexAttribPointer(aNor, 3, GLES20.GL_FLOAT, false, 0, mesh.nor)

                  GLES20.glDrawArrays(GLES20.GL_TRIANGLES, 0, mesh.count)
              }

              private fun compileShader(type: Int, src: String): Int {
                  val s = GLES20.glCreateShader(type)
                  GLES20.glShaderSource(s, src)
                  GLES20.glCompileShader(s)
                  return s
              }

              // Unit cube centered at origin, size 1 (-0.5 .. 0.5)
              private fun buildCube(): Mesh {
                  val normals = arrayOf(
                      floatArrayOf(1f, 0f, 0f), floatArrayOf(-1f, 0f, 0f),
                      floatArrayOf(0f, 1f, 0f), floatArrayOf(0f, -1f, 0f),
                      floatArrayOf(0f, 0f, 1f), floatArrayOf(0f, 0f, -1f)
                  )
                  val axesU = arrayOf(
                      floatArrayOf(0f, 1f, 0f), floatArrayOf(0f, 1f, 0f),
                      floatArrayOf(1f, 0f, 0f), floatArrayOf(1f, 0f, 0f),
                      floatArrayOf(1f, 0f, 0f), floatArrayOf(1f, 0f, 0f)
                  )
                  val axesV = arrayOf(
                      floatArrayOf(0f, 0f, 1f), floatArrayOf(0f, 0f, 1f),
                      floatArrayOf(0f, 0f, 1f), floatArrayOf(0f, 0f, 1f),
                      floatArrayOf(0f, 1f, 0f), floatArrayOf(0f, 1f, 0f)
                  )
                  val corners = arrayOf(
                      floatArrayOf(-1f, -1f), floatArrayOf(1f, -1f),
                      floatArrayOf(1f, 1f), floatArrayOf(-1f, 1f)
                  )
                  val order = intArrayOf(0, 1, 2, 0, 2, 3)

                  val pos = ArrayList<Float>()
                  val nor = ArrayList<Float>()
                  for (f in 0 until 6) {
                      val n = normals[f]
                      val u = axesU[f]
                      val v = axesV[f]
                      for (k in order) {
                          val s1 = corners[k][0] * 0.5f
                          val s2 = corners[k][1] * 0.5f
                          pos.add(n[0] * 0.5f + u[0] * s1 + v[0] * s2)
                          pos.add(n[1] * 0.5f + u[1] * s1 + v[1] * s2)
                          pos.add(n[2] * 0.5f + u[2] * s1 + v[2] * s2)
                          nor.add(n[0]); nor.add(n[1]); nor.add(n[2])
                      }
                  }
                  return Mesh(pos.toFloatArray(), nor.toFloatArray())
              }

              // Flat ground, unit size on XZ, normal pointing up
              private fun buildPlane(): Mesh {
                  val pos = floatArrayOf(
                      -0.5f, 0f, -0.5f,
                       0.5f, 0f, -0.5f,
                       0.5f, 0f,  0.5f,
                      -0.5f, 0f, -0.5f,
                       0.5f, 0f,  0.5f,
                      -0.5f, 0f,  0.5f
                  )
                  val nor = FloatArray(18)
                  for (i in 0 until 6) {
                      nor[i * 3] = 0f
                      nor[i * 3 + 1] = 1f
                      nor[i * 3 + 2] = 0f
                  }
                  return Mesh(pos, nor)
              }
          }
          EOF

          echo "[SUCCESS] 3D test source files written."

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombieZ-3D-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
