name: Auto Build Erangel Zombie APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python & Generate Assets
      run: |
        python3 -m pip install --upgrade pip
        pip install Pillow
        python3 generate_assets.py

    - name: Auto-Construct Android Project Structure & Gradle Files
      run: |
        mkdir -p app/src/main/java/com/zombiez/game
        mkdir -p app/src/main/res/drawable

        # Move Kotlin files to correct package path
        mv MainActivity.kt app/src/main/java/com/zombiez/game/
        mv GameView.kt app/src/main/java/com/zombiez/game/

        # Create root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '7.4.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.8.0' apply false
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF

        # Create settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "ZombieZ-Erangel"
        include ':app'
        EOF

        # Create app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.zombiez.game'
            compileSdk 33
            defaultConfig {
                applicationId "com.zombiez.game"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
            kotlinOptions {
                jvmTarget = '1.8'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # Create AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.zombiez.game">
            <application
                android:allowBackup="true"
                android:icon="@drawable/icon"
                android:label="Zombie Z Erangel"
                android:roundIcon="@drawable/icon"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:screenOrientation="landscape">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Build APK via Gradle
      run: |
        gradle wrapper --gradle-version 7.5
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZombieZ-Erangel-APK
        path: app/build/outputs/apk/debug/*.apk
