name: Auto Build Erangel Zombie APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Auto-Construct Android Project & Verify Structure via Python
        run: |
          python3 - << 'EOF'
          import os
          import textwrap

          print("[INFO] Starting Python automated structural validation & setup...")

          # 1. Create required directory structure
          os.makedirs("app/src/main/java/com/zombiez/game", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)

          # 2. Safely move and verify Kotlin source files
          for file in ["MainActivity.kt", "GameView.kt"]:
              if os.path.exists(file):
                  with open(file, "r", encoding="utf-8") as f:
                      content = f.read()

                  if "package com.zombiez.game" not in content:
                      content = "package com.zombiez.game\n" + content

                  dest = os.path.join(
                      "app/src/main/java/com/zombiez/game",
                      file
                  )

                  with open(dest, "w", encoding="utf-8") as f:
                      f.write(content)

                  print(f"[VERIFIED & MOVED] {file} -> {dest}")

          # 3. Write clean root build.gradle with compatible AGP 8.1.1 and Kotlin 1.9.0
          with open("build.gradle", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent("""\
                  buildscript {
                      repositories {
                          google()
                          mavenCentral()
                      }
                      dependencies {
                          classpath 'com.android.tools.build:gradle:8.1.1'
                          classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
                      }
                  }

                  allprojects {
                      repositories {
                          google()
                          mavenCentral()
                      }
                  }

                  task clean(type: Delete) {
                      delete rootProject.buildDir
                  }
              """))

          # 4. Write clean settings.gradle
          with open("settings.gradle", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent("""\
                  rootProject.name = "ZombieZ-Erangel"
                  include ':app'
              """))

          # 5. Write clean app/build.gradle
          with open("app/build.gradle", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent("""\
                  apply plugin: 'com.android.application'
                  apply plugin: 'org.jetbrains.kotlin.android'

                  android {
                      namespace 'com.zombiez.game'
                      compileSdk 33

                      defaultConfig {
                          applicationId "com.zombiez.game"
                          minSdk 21
                          targetSdk 33
                          versionCode 1
                          versionName "1.0"
                      }

                      buildTypes {
                          release {
                              minifyEnabled false
                              proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                          }
                      }

                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_1_8
                          targetCompatibility JavaVersion.VERSION_1_8
                      }

                      kotlinOptions {
                          jvmTarget = '1.8'
                      }
                  }

                  dependencies {
                      implementation 'androidx.core:core-ktx:1.10.1'
                      implementation 'androidx.appcompat:appcompat:1.6.1'
                  }
              """))

          # 6. Write AndroidManifest.xml
          with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent("""\
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                      package="com.zombiez.game">

                      <application
                          android:allowBackup="true"
                          android:icon="@drawable/icon"
                          android:label="Zombie Z Erangel"
                          android:roundIcon="@drawable/icon"
                          android:supportsRtl="true"
                          android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                          <activity
                              android:name=".MainActivity"
                              android:exported="true"
                              android:screenOrientation="landscape">

                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>

                          </activity>
                      </application>
                  </manifest>
              """))

          print("[SUCCESS] Android project files created successfully!")
          EOF

      - name: Generate Gradle Wrapper & Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombieZ-Erangel-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

